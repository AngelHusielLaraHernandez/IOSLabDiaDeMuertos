<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrada a Mictlán</title>
<style>
:root{--noche:#120a1f;--morado:#2a1244;--flor:#ff9d1c;--magenta:#d6247a;--hueso:#f3ead8;--piedra:#3b2a4d}
@media (prefers-color-scheme:dark){:root{--noche:#120a1f}}
*{box-sizing:border-box;margin:0}
html,body{margin:0;padding:0;height:100%;background:var(--noche);color:var(--hueso);font-family:Karla,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,var(--morado),var(--noche) 70%)}
#scene{width:80vw;height:100vh;position:relative;transform-origin:50% 68%;transition:transform 3.4s cubic-bezier(.65,0,.9,.4)}
#scene svg{width:100%;height:100%;display:block;overflow:visible}
.doorL,.doorR{transition:transform 2.2s cubic-bezier(.6,0,.2,1)}
.open .doorL{transform:translateX(-92px)}
.open .doorR{transform:translateX(92px)}
#glow{opacity:.25;transition:opacity 2s ease .3s}
.open #glow{opacity:1}
.cross #scene{transform:scale(7.5)}
#hint{position:absolute;z-index:10;bottom:calc(8% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:1rem;letter-spacing:.02em;transition:opacity .6s}
#hint button{all:unset;cursor:pointer;padding:.9rem 1.6rem;border:2px solid var(--flor);border-radius:2rem;color:var(--flor);font-weight:600;animation:pulso 2.4s ease-in-out infinite}
#hint button:focus-visible{outline:3px solid var(--hueso);outline-offset:3px}
@keyframes pulso{50%{box-shadow:0 0 22px 2px rgba(255,157,28,.45)}}
.started #hint{opacity:0;pointer-events:none}
#petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.p{position:absolute;top:-6vh;width:10px;height:15px;border-radius:70% 0 70% 0;background:var(--flor);opacity:.85;animation:cae linear infinite}
.p.m{background:var(--magenta)}
@keyframes cae{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:titila 1.3s ease-in-out infinite alternate}
@keyframes titila{from{transform:scale(1,.88)}to{transform:scale(.92,1.08)}}
#veil{position:absolute;inset:0;background:radial-gradient(circle,#ffd27a,var(--flor) 40%,var(--morado));opacity:0;pointer-events:none;transition:opacity 1.4s ease}
.arrived #veil{opacity:1}
#final{position:absolute;inset:0;z-index:10;display:grid;place-content:center;justify-items:center;gap:1.1rem;padding:2rem;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.6s ease .5s;background:radial-gradient(ellipse at 50% 120%,rgba(214,36,122,.35),transparent 60%)}
.arrived #final{opacity:1;pointer-events:auto}
.arrived #veil{opacity:0;transition:opacity 2s ease .4s}
.arrived #scene,.arrived #petals{opacity:0;transition:opacity 1s}
#final h1{font-family:'Rozha One',Georgia,serif;font-weight:400;font-size:clamp(2.6rem,11vw,4.4rem);line-height:1;color:var(--flor);text-shadow:0 0 30px rgba(255,157,28,.4)}
#final p{max-width:30ch;line-height:1.5;color:var(--hueso);font-size:1.05rem}
#final .go{all:unset;cursor:pointer;margin-top:.6rem;padding:.95rem 2rem;border-radius:2rem;background:var(--flor);color:var(--noche);font-weight:600;font-size:1.05rem}
#final .go:focus-visible{outline:3px solid var(--hueso);outline-offset:3px}
#final .re{all:unset;cursor:pointer;font-size:.9rem;opacity:.7;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.p,.flame,#hint button{animation:none}#scene,.doorL,.doorR{transition-duration:.01s}}
#titulo{--u:min(14vw,12vh);position:absolute;top:15vh;left:0;right:0;z-index:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.3);color:var(--flor);pointer-events:none;animation:entra 1.8s ease backwards;transition:opacity 1.2s ease,visibility 0s 1.2s}
#titulo .w{display:flex;align-items:flex-end;gap:calc(var(--u)*.14)}
#titulo .gl{display:block;flex:none;fill:currentColor;overflow:visible}
@keyframes entra{from{opacity:0;transform:translateY(-12px)}}
.cross #titulo,.arrived #titulo{opacity:0;visibility:hidden}
</style>
</head>

(function(){
  var app=document.getElementById('app'),box=document.getElementById('petals');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // pétalos de cempasúchil
  if(!reduce){for(var i=0;i<26;i++){var p=document.createElement('i');p.className='p'+(i%6==0?' m':'');
    p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(7+Math.random()*7)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';p.style.setProperty('--dx',(Math.random()*120-60)+'px');
    p.style.setProperty('--r',(300+Math.random()*500)+'deg');box.appendChild(p);}}
  var timers=[];
  function send(a){try{window.webkit.messageHandlers.bookAction.postMessage(a);}catch(e){}}
  function later(f,t){timers.push(setTimeout(f,t));}
  function run(){
    app.classList.add('started','open');
    later(function(){app.classList.add('cross');},reduce?50:1900);
    later(function(){app.classList.add('arrived');},reduce?100:4700);
  }
  function reset(){
    timers.forEach(clearTimeout);timers=[];
    app.classList.remove('started','open','cross','arrived');
  }
  document.getElementById('start').addEventListener('click',function(){send('clicked');run();});
  document.getElementById('again').addEventListener('click',reset);
  document.getElementById('enter').addEventListener('click',function(){
    // Puente con Swift: handler "bookAction", mensaje "opened"
    send('opened');
  });
})();
</script>
</body>
</html>
